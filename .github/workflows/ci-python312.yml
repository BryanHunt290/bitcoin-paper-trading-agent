name: CI (Python 3.12)

on:
  push:
    branches: [ 'main' ]
  pull_request:
    branches: [ 'main' ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.12' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-dashboard.txt -r cdk/requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Compile source
        run: python -m compileall src streamlit_app.py

      - name: Validate Streamlit startup
        run: python -m streamlit run streamlit_app.py --server.headless true --server.port 8501 & sleep 8; curl --fail http://127.0.0.1:8501/_stcore/health

      - name: Synthesize reviewed CDK stacks
        run: python cdk/run_synth.py

